apiVersion: "serving.kserve.io/v1beta1"
kind: "InferenceService"
metadata:
  name: model
  namespace: default
spec:
  predictor:
    serviceAccountName: "kserve-sa"
    model:
      modelFormat:
        name: sklearn
      storageUri: "s3://ml-basics/model/"
      resources:
        requests:
          cpu: 500m
          memory: 1Gi